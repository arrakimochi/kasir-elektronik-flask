<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Kasir{% endblock %} - Toko Elektronik Maju Jaya</title>
  <style>
    body { font-family: sans-serif; margin: 20px; max-width: 960px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .r { text-align: right; }
    .ok { color: #17703f; }
    .err { color: #b3261e; }
    .box { border: 1px solid #ccc; padding: 12px 16px; margin-bottom: 20px; }
    h2 { margin-top: 28px; }
  </style>
</head>
<body>
  <h1>Toko Elektronik Maju Jaya</h1>

  {% with pesan = get_flashed_messages(with_categories=true) %}
    {% for kategori, isi in pesan %}
      <p class="{{ kategori }}"><strong>{{ isi }}</strong></p>
    {% endfor %}
  {% endwith %}

  {% block isi %}{% endblock %}
</body>
</html>
